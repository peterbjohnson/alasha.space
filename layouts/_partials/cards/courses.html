{{- $p := .page -}}
<article class="course-card {{ if $p.Params.featured }}featured{{ else }}pale{{ end }}">
  {{ partial "placeholder.html" $p }}
  {{- with $p.Params.kicker }}<p class="kicker">{{ . }}</p>{{ end }}
  <h3>{{ $p.Title }}</h3>
  {{- with $p.Params.summary }}<p>{{ . }}</p>{{ end }}
  <div class="course-bottom">
    <strong>{{ $p.Params.price }}</strong>
    {{- if $p.Params.featured }}
    <a class="button light" href="{{ $p.RelPermalink }}">{{ i18n "aboutCourse" }}</a>
    {{- else }}
    <a href="{{ $p.RelPermalink }}">{{ i18n "details" }}</a>
    {{- end }}
  </div>
</article>
