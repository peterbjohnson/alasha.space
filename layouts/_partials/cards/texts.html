{{- $p := .page -}}
<article class="feature-card{{ if .large }} large{{ end }}">
  {{ partial "placeholder.html" $p }}
  {{- with $p.Params.tag }}<div class="tag">{{ . }}</div>{{ end }}
  {{- partial "meta.html" (dict "page" $p) }}
  <h3><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h3>
  {{- with $p.Params.summary }}<p>{{ . }}</p>{{ end }}
  <a href="{{ $p.RelPermalink }}">{{ if .large }}{{ i18n "readText" }}{{ else }}{{ i18n "read" }}{{ end }}</a>
</article>
